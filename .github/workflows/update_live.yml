name: Update Live JSON for ESP32

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-live-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Récupère l'historique complet pour éviter les erreurs de rejet

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pandas and openpyxl
        run: pip install pandas openpyxl

      - name: Run live JSON generator
        run: python update_live.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update live.json for ESP32"
          file_pattern: "data/live.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
