name: Update Live JSON for ESP32

on:
  schedule:
    - cron: '*/10 * * * *' # S'exécute toutes les 10 minutes
  workflow_dispatch: # Permet de le lancer manuellement depuis l'interface GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl

      - name: Run update script
        run: python update_live.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update live.json for ESP32" && git push)
