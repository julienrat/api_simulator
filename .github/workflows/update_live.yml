name: Update live.json

on:
  schedule:
    # Toutes les 30 minutes (heure UTC). GitHub peut retarder l'exécution de quelques minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch:  # lancement manuel depuis l'onglet Actions

permissions:
  contents: write  # nécessaire pour committer data/live.json

# Évite deux exécutions simultanées qui se marcheraient dessus au moment du push
concurrency:
  group: update-live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: pip install pandas openpyxl tzdata

      - name: Génération de data/live.json
        run: python update_live.py

      - name: Commit et push si le fichier a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          if git diff --cached --quiet; then
            echo "Aucun changement, rien à committer."
          else
            git commit -m "chore: mise à jour live.json"
            git pull --rebase
            git push
          fi
